<title>Mala da Odisseia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Um só mundo visual (carta náutica à noite), de propósito: o iPad fica aceso na bancada. */
:root{
  --bg:#0b1a2b; --bg2:#0f2237; --panel:#132a43; --line:#244566; --ink:#eef4fa; --mute:#8fa8c2;
  --card:#f3f6f9; --card-ink:#10253a; --card-mute:#5b7089;
  --go:#2fd3a0; --go-ink:#04281d; --wait:#f5a83c; --wait-ink:#3a2200; --no:#9a8be0; --ok:#7ee0ff;
  --font-d:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif;
  --font-b:"Figtree",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:radial-gradient(1200px 700px at 80% -10%,#16385a 0%,transparent 60%),var(--bg);color:var(--ink);font-family:var(--font-b);font-size:16px;line-height:1.35;padding-inline:16px;padding-block:12px;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--ok);outline-offset:2px;border-radius:8px}
.app{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:14px;min-height:calc(100vh - 24px)}

/* topo */
.top{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
.brand h1{font:800 clamp(1.3rem,2.6vw,1.9rem)/1 var(--font-d);margin:0;letter-spacing:-.01em}
.brand p{margin:4px 0 0;color:var(--mute);font-size:.85rem}
.route{position:relative;height:54px;min-width:0}
.route .line{position:absolute;left:18px;right:18px;top:26px;height:4px;border-radius:4px;background:var(--line)}
.route .fill{position:absolute;left:18px;top:26px;height:4px;border-radius:4px;background:linear-gradient(90deg,var(--go),var(--ok));width:0;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.port{position:absolute;top:19px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--bg);border:3px solid var(--line);transition:.4s}
.port.on{border-color:var(--go);background:var(--go)}
.port span{position:absolute;top:-19px;left:50%;transform:translateX(-50%);font-size:.72rem;color:var(--mute);white-space:nowrap}
.port span.b{top:22px}
.ship{position:absolute;top:2px;width:30px;height:30px;margin-left:-15px;transition:left .6s cubic-bezier(.2,.8,.2,1)}
.stats{display:flex;gap:10px;align-items:center}
.rank{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 12px;text-align:right}
.rank b{display:block;font:700 1rem/1.1 var(--font-d)}
.rank small{color:var(--mute);font-variant-numeric:tabular-nums}
.sync{font-size:.72rem;color:var(--mute);display:flex;gap:6px;align-items:center}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--go);display:inline-block}
.sync.off i{background:var(--wait)}

/* modos */
.modes{display:inline-flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;align-self:flex-start}
.modes button{background:none;border:0;padding:10px 20px;border-radius:10px;font-weight:600;color:var(--mute);min-height:44px}
.modes button[aria-pressed=true]{background:var(--ink);color:var(--bg)}

/* corpo */
.body{display:grid;grid-template-columns:260px 1fr;gap:16px;flex:1;min-height:0}
.rail{display:flex;flex-direction:column;gap:8px}
.cat{display:grid;grid-template-columns:44px 1fr;gap:12px;align-items:center;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;min-height:60px}
.cat[aria-current=true]{border-color:var(--ok);background:var(--bg2);box-shadow:0 0 0 1px var(--ok) inset}
.cat b{display:block;font-weight:600}
.cat small{color:var(--mute);font-variant-numeric:tabular-nums}
.ring{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--go) calc(var(--p)*1%),var(--line) 0);position:relative}
.ring::after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--panel)}
.cat[aria-current=true] .ring::after{background:var(--bg2)}
.ring svg{position:relative;z-index:1;width:20px;height:20px;stroke:var(--ink);fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ring.done svg{stroke:var(--go)}
.stamp{display:inline-block;margin-left:6px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--go);border:1.5px solid var(--go);border-radius:6px;padding:0 5px;transform:rotate(-4deg)}

.stage{position:relative;display:flex;flex-direction:column;align-items:center;gap:14px;min-width:0}
.deckrow{width:100%;display:grid;grid-template-columns:minmax(70px,1fr) minmax(0,440px) minmax(70px,1fr);gap:14px;align-items:center}
.pile{text-align:center;border-radius:18px;padding:14px 8px;border:2px dashed var(--line);color:var(--mute);transition:.2s}
.pile b{display:block;font:800 2.2rem/1 var(--font-d);font-variant-numeric:tabular-nums}
.pile span{font-size:.78rem}
.pile.l b{color:var(--wait)} .pile.r b{color:var(--go)}
.pile.hot.l{border-color:var(--wait);background:rgba(245,168,60,.12)} .pile.hot.r{border-color:var(--go);background:rgba(47,211,160,.12)}
.deck{position:relative;width:100%;aspect-ratio:3/4;max-height:56vh;min-height:330px;touch-action:pan-y}
.ghost{position:absolute;inset:0;background:var(--card);border-radius:26px;opacity:.5}
.ghost.g1{transform:translateY(10px) scale(.96);opacity:.35}
.ghost.g2{transform:translateY(20px) scale(.92);opacity:.2}
.card{position:absolute;inset:0;background:var(--card);color:var(--card-ink);border-radius:26px;padding:56px 26px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 18px 40px rgba(0,0,0,.45);cursor:grab;user-select:none;-webkit-user-select:none;touch-action:pan-y;will-change:transform}
.card:active{cursor:grabbing}
.card.fly{transition:transform .28s ease-in,opacity .28s}
.card.back{transition:transform .25s cubic-bezier(.2,1.4,.4,1)}
.card::before{content:"";position:absolute;top:16px;left:50%;width:22px;height:22px;margin-left:-11px;border-radius:50%;background:var(--bg);box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.card .tag{font-size:.72rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--card-mute)}
.card h2{font:800 clamp(1.5rem,3.4vw,2.2rem)/1.08 var(--font-d);margin:0;text-wrap:balance}
.card .hint{color:var(--card-mute);font-size:.95rem;margin:0}
.card .dest{display:inline-flex;align-self:flex-start;gap:6px;border-radius:999px;padding:4px 12px;font-size:.8rem;font-weight:600;background:#dde7f0;color:var(--card-ink)}
.card .dest.mao{background:#d7f3ea}
.qty{margin-top:auto;display:flex;align-items:center;gap:12px;background:#e7eef5;border-radius:16px;padding:8px 10px}
.qty span{flex:1;font-size:.82rem;color:var(--card-mute)}
.qty button{width:44px;height:44px;border-radius:12px;border:0;background:var(--card-ink);color:var(--card);font:700 1.4rem/1 var(--font-d)}
.qty output{min-width:2.2ch;text-align:center;font:800 1.7rem/1 var(--font-d);font-variant-numeric:tabular-nums}
.sugg{font-size:.72rem;color:var(--card-mute)}
.swipelbl{position:absolute;top:28px;padding:6px 14px;border:3px solid;border-radius:10px;font:800 1.1rem var(--font-d);letter-spacing:.06em;opacity:0;pointer-events:none;text-transform:uppercase}
.swipelbl.r{right:22px;color:#0b9c71;border-color:#0b9c71;transform:rotate(8deg)}
.swipelbl.l{left:22px;color:#c77708;border-color:#c77708;transform:rotate(-8deg)}
.empty{position:absolute;inset:0;border-radius:26px;border:2px dashed var(--line);display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;text-align:center;padding:24px}
.empty h2{font:800 1.6rem var(--font-d);margin:0}
.empty p{margin:0;color:var(--mute);max-width:30ch}

.actions{display:grid;grid-template-columns:1fr auto 1fr;gap:12px;width:100%;max-width:700px}
.btn{min-height:56px;border-radius:16px;border:0;font-weight:700;padding:0 18px}
.btn.l{background:var(--wait);color:var(--wait-ink)}
.btn.r{background:var(--go);color:var(--go-ink)}
.btn.n{background:var(--panel);border:1px solid var(--line);color:var(--ink)}
.btn.p{background:var(--ink);color:var(--bg)}
.btn:disabled{opacity:.35;cursor:default}
.sub{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;align-items:center;color:var(--mute);font-size:.85rem}
.link{background:none;border:0;color:var(--ok);text-decoration:underline;padding:8px;min-height:40px}
.add{display:flex;gap:8px}
.add input{background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:10px 12px;font:inherit;min-height:44px;width:min(260px,52vw)}

.clima{width:100%;max-width:700px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px 14px;font-size:.85rem}
.clima summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.clima table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.clima th,.clima td{text-align:left;padding:3px 6px;border-bottom:1px solid var(--line)}
.clima .wrap{overflow-x:auto}
.clima p{margin:8px 0 0;color:var(--mute)}
.rain{color:var(--ok);font-weight:600}

/* resumo */
.sum{width:100%;display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px;align-items:start}
.sumcol{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px}
.sumcol h3{margin:0 0 4px;font:700 1.05rem var(--font-d);display:flex;justify-content:space-between}
.sumcol h3 em{font-style:normal;color:var(--mute);font-variant-numeric:tabular-nums}
.sumcol ul{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.chip{width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-height:44px;display:flex;justify-content:space-between;gap:8px}
.chip small{color:var(--mute)}
.chip.essential{border-color:var(--wait)}
.ready{grid-column:1/-1;display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:linear-gradient(135deg,#123a45,#0f2a40);border:1px solid var(--go);border-radius:18px;padding:16px}
.ready p{margin:0;max-width:60ch}

.toast{position:fixed;left:50%;bottom:26px;transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s;z-index:20;text-align:center;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0)}
.dot{position:fixed;width:9px;height:9px;border-radius:2px;pointer-events:none;z-index:19;animation:pop 1s ease-out forwards}
@keyframes pop{from{transform:translate(0,0) rotate(0);opacity:1}to{transform:translate(var(--x),var(--y)) rotate(360deg);opacity:0}}
/* documentos */
.dlist{width:100%;display:flex;flex-direction:column;gap:12px}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;gap:8px}
.dcard .when{font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.dcard h3{margin:0;font:800 1.15rem var(--font-d)}
.dcard .facts{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--ink);font-size:.92rem}
.dcard .facts b{font-variant-numeric:tabular-nums}
.dcard .st{font-size:.9rem}
.links{display:flex;flex-wrap:wrap;gap:8px}
.links a{display:inline-flex;align-items:center;min-height:44px;padding:8px 14px;border-radius:12px;background:var(--ink);color:var(--bg);font-weight:700;text-decoration:none}
.links a.sec{background:var(--bg2);color:var(--ink);border:1px solid var(--line)}
/* plano */
.plan{width:100%;display:flex;flex-direction:column;gap:14px}
.plan .intro{margin:0;color:var(--mute);font-size:.9rem}
.stage-sec{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.stage-sec h3{margin:0;font:800 1.1rem var(--font-d);display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.stage-sec h3 em{font:600 .85rem var(--font-b);font-style:normal;color:var(--mute)}
.stage-sec .sub2{margin:2px 0 0;color:var(--mute);font-size:.82rem}
.stage-sec ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.ptask .tk{background:none;border:0;padding:4px 0;min-height:44px}
.ptask.done .nmx{color:var(--mute)}
.pmeta{font-size:.84rem;color:var(--mute);display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap}
.pcond{font-size:.84rem;color:var(--ink)}
.tagc{font-size:.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;border-radius:6px;padding:2px 6px;border:1.5px solid;white-space:nowrap}
.tagc.ok{color:var(--go);border-color:var(--go)} .tagc.pend{color:var(--wait);border-color:var(--wait)} .tagc.man{color:var(--ok);border-color:var(--ok)}
.pdel{align-self:flex-start}
.padd{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px;display:grid;gap:8px}
.padd label{font-size:.82rem;color:var(--mute);display:grid;gap:4px}
.padd input,.padd select{background:var(--bg2);border:1px solid var(--line);border-radius:12px;color:var(--ink);padding:10px 12px;font:inherit;min-height:44px;width:100%}
/* à vista */
.vis{width:100%;display:flex;flex-direction:column;gap:14px}
.tally{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.tally p{margin:0;color:var(--mute);font-size:.9rem}
.zones{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:start}
.zone{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--line);border-radius:16px;padding:12px}
.zone.z-f{border-top-color:var(--wait)} .zone.z-s{border-top-color:var(--ok)} .zone.z-m{border-top-color:var(--go)}
.zone h3{margin:0;font:800 1.05rem var(--font-d);display:flex;justify-content:space-between;align-items:baseline}
.zone h3 em{font:800 1.8rem/1 var(--font-d);font-style:normal;font-variant-numeric:tabular-nums}
.zone ul,.ess ul,.tasks ul{list-style:none;margin:10px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.row{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px}
.row .nm{display:flex;justify-content:space-between;gap:8px;align-items:center;font-weight:600}
.row .nm small{color:var(--mute);font-weight:400;white-space:nowrap}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{flex:1;min-width:64px;min-height:40px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--mute);font-weight:600;font-size:.82rem}
.seg button.on.f{background:var(--wait);color:var(--wait-ink);border-color:var(--wait)}
.seg button.on.s{background:var(--ok);color:#04202b;border-color:var(--ok)}
.seg button.on.m{background:var(--go);color:var(--go-ink);border-color:var(--go)}
.seg button.x{flex:0 0 auto;min-width:40px;font-size:.75rem}
.vq{display:inline-flex;gap:6px;align-items:center}
.vq button{width:36px;height:36px;border-radius:10px;border:0;background:var(--ink);color:var(--bg);font:700 1.2rem/1 var(--font-d)}
.vq output{min-width:2ch;text-align:center;font-weight:800;font-variant-numeric:tabular-nums}
.ess,.tasks,.nao{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
.ess h3,.tasks h3{margin:0;font:700 1.05rem var(--font-d)}
.ess p,.tasks p{margin:4px 0 0;color:var(--mute);font-size:.85rem}
.ess ul{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.tk{display:flex;gap:10px;align-items:center;min-height:44px;width:100%;text-align:left;background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.tk i{width:22px;height:22px;border-radius:7px;border:2px solid var(--mute);flex:none;display:grid;place-items:center;font-style:normal;color:var(--go-ink)}
.tk.done i{background:var(--go);border-color:var(--go)}
.tk.done span{color:var(--mute);text-decoration:line-through}
.nao summary{cursor:pointer;min-height:32px;color:var(--mute)}
@media (max-width:900px){.zones{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

@media (max-width:900px){
  .top{grid-template-columns:1fr auto}.route{grid-column:1/-1;order:3}
  .body{grid-template-columns:1fr}
  .rail{flex-direction:row;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x proximity}
  .cat{min-width:190px;scroll-snap-align:start}
  .deckrow{grid-template-columns:1fr}
  .pile{display:none}
  .deck{max-height:none;aspect-ratio:auto;height:min(60vh,430px)}
}
</style>

<div class="app">
  <header class="top">
    <div class="brand"><h1>Mala da Odisseia</h1><p>Barcelona → Sevilha → Málaga · 19 a 28 de outubro</p></div>
    <div class="route" id="route" aria-hidden="true">
      <div class="line"></div><div class="fill" id="fill"></div>
      <div class="port" id="p0" style="left:18px"><span>Barcelona</span></div>
      <div class="port" id="p1" style="left:calc(18px + (100% - 36px)*.33)"><span>Sevilha</span></div>
      <div class="port" id="p2" style="left:calc(18px + (100% - 36px)*.66)"><span>Málaga</span></div>
      <div class="port" id="p3" style="left:calc(100% - 18px)"><span>De volta</span></div>
      <svg class="ship" id="ship" viewBox="0 0 30 30" aria-hidden="true"><path d="M15 3v15M15 4l9 11H15M15 7l-7 8h7" fill="#eef4fa" stroke="#eef4fa" stroke-width="1" stroke-linejoin="round"/><path d="M4 19h22l-3 6H7z" fill="#f5a83c"/></svg>
    </div>
    <div class="stats">
      <div class="rank"><b id="rank">Grumete</b><small id="xp">0 XP</small></div>
    </div>
  </header>

  <div style="display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap">
    <div class="modes" role="group" aria-label="Fase">
      <button id="m-vis" aria-pressed="true">À vista</button>
      <button id="m-plan" aria-pressed="false">Plano</button>
      <button id="m-doc" aria-pressed="false">Documentos</button>
      <button id="m-sep" aria-pressed="false">Triagem</button>
      <button id="m-con" aria-pressed="false">Guardar</button>
    </div>
    <div class="sync" id="sync"><i></i><span>conectando…</span></div>
  </div>

  <main class="body">
    <nav class="rail" id="rail" aria-label="Categorias"></nav>
    <section class="stage" id="stage"></section>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
"use strict";
var CATS=[
 {id:"docs",name:"Documentos e essenciais",icon:'<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M9 8h6M9 12h6M9 16h3"/>'},
 {id:"roupas",name:"Roupas",icon:'<path d="M8 3l-5 4 3 3 2-1v12h8V9l2 1 3-3-5-4a4 4 0 01-8 0z"/>'},
 {id:"clima",name:"Clima",icon:'<path d="M7 18a4 4 0 010-8 5 5 0 019.6-1A4.5 4.5 0 0117 18z"/><path d="M9 21l1-2M13 21l1-2"/>'},
 {id:"necess",name:"Necessaire e rotina",icon:'<rect x="4" y="8" width="16" height="12" rx="3"/><path d="M9 8V6a3 3 0 016 0v2"/>'},
 {id:"eletro",name:"Eletrônicos",icon:'<rect x="8" y="2" width="8" height="20" rx="2"/><path d="M11 18h2"/>'},
 {id:"mao",name:"Comigo na mão",icon:'<path d="M5 9h14l-1 11H6z"/><path d="M9 9V7a3 3 0 016 0v2"/>'}
];
var ITEMS=[
 {id:"id-foto",cat:"docs",name:"Documento de identidade com foto",dest:"mao",hint:"O trem de segunda (09:12) e o ônibus de quinta pedem documento."},
 {id:"cel-bilhetes",cat:"docs",name:"Celular com os bilhetes baixados",dest:"mao",hint:"Trem iryo, Alcázar, Luminiscence (QR da Fever) e ônibus Alsa."},
 {id:"carteira",cat:"docs",name:"Carteira e cartões de pagamento",dest:"mao",hint:""},
 {id:"chaves",cat:"docs",name:"Chaves de casa",dest:"mao",hint:""},

function isEss(i){return i.cat==="docs"||i.dest==="mao"}
var S={plano:{},pcol:null,docs:{},cat:"docs",mode:"vis",undo:[],db:null,col:null,sync:"conectando"};
var chain={};
var $=function(i){return document.getElementById(i)};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}

function allItems(){
  var out=ITEMS.slice();
  Object.keys(S.docs).forEach(function(id){var d=S.docs[id];if(d&&d.custom&&d.name){out.push({id:id,cat:d.cat||"docs",name:d.name,dest:d.dest||"mala",hint:d.hint||"",qty:d.qty,unit:d.unit,custom:true})}});
  return out;
}
function st(id){var d=S.docs[id];return (d&&d.state)||"novo"}
function qtyOf(it){var d=S.docs[it.id];return (d&&typeof d.qty==="number")?d.qty:it.qty}
function inCat(c){return allItems().filter(function(i){return i.cat===c})}
function catDone(c){return inCat(c).every(function(i){var s=st(i.id);return s==="separado"||s==="namala"||s==="conferido"||s==="naovai"})}
function catStats(c){var l=inCat(c).filter(function(i){return st(i.id)!=="naovai"});var d=l.filter(function(i){var s=st(i.id);return s==="separado"||s==="namala"||s==="conferido"}).length;return {d:d,t:l.length}}
function deck(){
  var items=allItems();
  if(S.mode==="con"){
    return items.filter(function(i){return st(i.id)==="separado"}).sort(function(a,b){return CATS.findIndex(function(c){return c.id===a.cat})-CATS.findIndex(function(c){return c.id===b.cat})});
  }
  var c=inCat(S.cat);
  var novos=c.filter(function(i){return st(i.id)==="novo"});
  var falta=c.filter(function(i){return st(i.id)==="falta"}).sort(function(a,b){return ((S.docs[a.id]||{}).updatedAt||0)-((S.docs[b.id]||{}).updatedAt||0)});
  return novos.concat(falta);
}

/* persistência */
function save(id,data){
  S.docs[id]=data; render();
  if(!S.col){return}
  var prev=chain[id]||Promise.resolve();
  chain[id]=prev.then(function(){return S.col.doc(id).set(data)}).then(function(){setSync("ok")},function(){setSync("err")});
}
function drop(id){
  delete S.docs[id]; render();
  if(!S.col){return}
  var prev=chain[id]||Promise.resolve();
  chain[id]=prev.then(function(){return S.col.doc(id).delete()}).then(function(){setSync("ok")},function(){setSync("err")});
}

  S.plano[id]=data; render();
  if(!S.pcol){return}
  var prev=pchain[id]||Promise.resolve();
  pchain[id]=prev.then(function(){return S.pcol.doc(id).set(data)}).then(function(){setSync("ok")},function(){setSync("err")});
}

}
function ptasks(){

  Object.keys(S.plano).forEach(function(id){var d=S.plano[id];if(d&&d.custom&&d.name){out.push({id:id,stage:d.stage||"pre",tag:"man",name:d.name,note:d.note||"",cond:d.cond||"",custom:true,linked:d.linked})}});
  return out;
}
function pdone(id){return !!(S.plano[id]&&S.plano[id].done)}
function setItem(id,patch,noUndo){
  var before=S.docs[id]?JSON.parse(JSON.stringify(S.docs[id])):null;
  if(!noUndo){S.undo.push({id:id,prev:before});if(S.undo.length>40)S.undo.shift()}
  var d=Object.assign({},S.docs[id]||{},patch,{updatedAt:Date.now(),by:"odara"});
  save(id,d);
}
function undo(){
  var u=S.undo.pop(); if(!u)return;
  if(u.prev){save(u.id,u.prev)}else{drop(u.id)}
}
function setSync(k){
  var el=$("sync");el.className="sync"+(k==="ok"?"":" off");
  el.querySelector("span").textContent=k==="ok"?"salvo e compartilhado":(k==="off"?"só neste aparelho":(k==="err"?"não consegui salvar agora":"conectando…"));
}

/* ações */
function act(dir){
  var d=deck(); if(!d.length)return;
  var it=d[0], wasDone=catDone(it.cat);
  if(dir==="r"){setItem(it.id,{state:S.mode==="con"?(isEss(it)?"conferido":"namala"):"separado"})}
  else if(dir==="l"){setItem(it.id,{state:"falta"})}
  else if(dir==="n"){setItem(it.id,{state:"naovai"})}

}

/* swipe */
function bindCard(){
  var card=document.getElementById("card"); if(!card)return;
  var x0=null,dx=0,id=null,lr=card.querySelector(".swipelbl.r"),ll=card.querySelector(".swipelbl.l");
  var pl=document.querySelector(".pile.l"),pr=document.querySelector(".pile.r");
  card.addEventListener("pointerdown",function(e){
    if(e.target.closest(".qty"))return;
    x0=e.clientX;dx=0;id=e.pointerId;card.setPointerCapture(id);card.classList.remove("back");
  });
  card.addEventListener("pointermove",function(e){
    if(x0===null)return;dx=e.clientX-x0;
    card.style.transform="translateX("+dx+"px) rotate("+dx/22+"deg)";
    lr.style.opacity=Math.max(0,Math.min(1,dx/110));ll.style.opacity=Math.max(0,Math.min(1,-dx/110));
    if(pl&&pr){pl.classList.toggle("hot",dx<-40);pr.classList.toggle("hot",dx>40)}
  });
  function end(){
    if(x0===null)return;var d=dx;x0=null;
    if(Math.abs(d)>110){
      card.classList.add("fly");
      card.style.transform="translateX("+(d>0?900:-900)+"px) rotate("+(d>0?28:-28)+"deg)";card.style.opacity="0";
      setTimeout(function(){act(d>0?"r":"l")},230);
    }else{
      card.classList.add("back");card.style.transform="";lr.style.opacity=0;ll.style.opacity=0;
      if(pl&&pr){pl.classList.remove("hot");pr.classList.remove("hot")}
    }
  }
  card.addEventListener("pointerup",end);card.addEventListener("pointercancel",end);
}
function flyBtn(dir){
  var card=document.getElementById("card");
  if(!card){act(dir);return}
  card.classList.add("fly");
  card.style.transform=dir==="n"?"translateY(-40px) scale(.9)":"translateX("+(dir==="r"?900:-900)+"px) rotate("+(dir==="r"?28:-28)+"deg)";
  card.style.opacity="0";
  setTimeout(function(){act(dir)},230);
}

function render(){
  renderTop();renderRail();renderModes();
  var s=$("stage");
  if(S.mode==="doc"){renderDocs(s)}else if(S.mode==="plan"){renderPlan(s)}else if(S.mode==="vis"){renderVis(s)}else if(S.mode==="res"){renderSum(s)}else{renderDeck(s)}
}
function renderModes(){
  $("m-vis").setAttribute("aria-pressed",S.mode==="vis");$("m-plan").setAttribute("aria-pressed",S.mode==="plan");$("m-doc").setAttribute("aria-pressed",S.mode==="doc");$("m-sep").setAttribute("aria-pressed",S.mode==="sep");$("m-con").setAttribute("aria-pressed",S.mode==="con");
  $("rail").style.display=S.mode==="sep"?"":"none";
  document.querySelector(".body").style.gridTemplateColumns=S.mode==="sep"&&window.innerWidth>900?"260px 1fr":"1fr";
}
function renderTop(){
  var items=allItems().filter(function(i){return st(i.id)!=="naovai"});
  var inb=items.filter(function(i){var s=st(i.id);return s==="namala"||s==="conferido"}).length;
  var sepn=items.filter(function(i){return st(i.id)==="separado"}).length;
  var done=inb;
  var pct=items.length?done/items.length:0;
  $("rank").textContent=inb+" na mala";$("xp").textContent=sepn+" separados · "+(items.length-inb-sepn)+" faltam";
  $("fill").style.width="calc((100% - 36px)*"+pct+")";
  $("ship").style.left="calc(18px + (100% - 36px)*"+pct+")";
  [0,.33,.66,1].forEach(function(t,i){$("p"+i).classList.toggle("on",pct>=t-0.001)});
}
function renderRail(){
  var h="";
  CATS.forEach(function(c){
    var s=catStats(c.id),p=s.t?Math.round(s.d/s.t*100):100,dn=catDone(c.id);
    h+='<button class="cat" data-c="'+c.id+'" aria-current="'+(S.cat===c.id)+'"><span class="ring'+(dn?" done":"")+'" style="--p:'+p+'"><svg viewBox="0 0 24 24" aria-hidden="true">'+c.icon+'</svg></span><span><b>'+c.name+(dn?'<span class="stamp">ok</span>':'')+'</b><small>'+s.d+' de '+s.t+'</small></span></button>';
  });
  $("rail").innerHTML=h;
}
function counts(){
  var scope=S.mode==="con"?allItems():inCat(S.cat);
  var f=scope.filter(function(i){return st(i.id)==="falta"}).length;
  var g=scope.filter(function(i){var s=st(i.id);return S.mode==="con"?(s==="namala"||s==="conferido"):(s==="separado"||s==="namala"||s==="conferido")}).length;
  return {f:f,g:g};
}

function renderVis(s){
  var items=allItems().sort(function(a,b){return CATS.findIndex(function(c){return c.id===a.cat})-CATS.findIndex(function(c){return c.id===b.cat})});
  var ess=items.filter(isEss).filter(function(i){return st(i.id)!=="naovai"});
  var rest=items.filter(function(i){return !isEss(i)});
  var fa=rest.filter(function(i){var x=st(i.id);return x==="novo"||x==="falta"});
  var se=rest.filter(function(i){return st(i.id)==="separado"});
  var ma=rest.filter(function(i){var x=st(i.id);return x==="namala"||x==="conferido"});
  var na=items.filter(function(i){return st(i.id)==="naovai"});
  var last=0;Object.keys(S.docs).forEach(function(k){var u=S.docs[k]&&S.docs[k].updatedAt;if(u>last)last=u});
  function catName(i){return CATS.find(function(c){return c.id===i.cat}).name.split(" ")[0]}
  function qtyH(i){var q=qtyOf(i);return typeof q==="number"?'<span class="vq"><button data-vq="'+i.id+'|-1" aria-label="Menos">−</button><output>'+q+'</output><button data-vq="'+i.id+'|1" aria-label="Mais">+</button></span>':''}

      +'<button class="f'+(f?' on':'')+'" data-set="'+i.id+'|falta">Falta</button>'
      +'<button class="s'+(x==="separado"?' on':'')+'" data-set="'+i.id+'|separado">Separado</button>'
      +'<button class="m'+((x==="namala"||x==="conferido")?' on':'')+'" data-set="'+i.id+'|namala">Na mala</button>'
      +'<button class="x" data-set="'+i.id+'|naovai" aria-label="Não vou levar">não vou</button><button class="x" data-buy="'+i.id+'" aria-label="Não levar e comprar no destino">comprar lá</button></div>'
      +(qtyOf(i)!==undefined&&typeof qtyOf(i)==="number"?'<div style="display:flex;justify-content:space-between;align-items:center"><small style="color:var(--mute)">Quantidade (sugestão)</small>'+qtyH(i)+'</div>':'')+'</li>';
  }
  function zone(cls,title,list,empty){
    var h='<section class="zone '+cls+'"><h3>'+title+'<em>'+list.length+'</em></h3><ul>';

    return h+'</ul></section>';
  }

  h+='<section class="ess"><h3>Essenciais comigo</h3><p>Documentos e o que vai na mão ou no bolso. Marque quando estiver mesmo com você.</p><ul>';
  ess.forEach(function(i){var x=st(i.id);
    h+='<li class="row"><div class="nm"><span>'+esc(i.name)+'</span><small>'+catName(i)+'</small></div>'+(i.hint?'<small style="color:var(--mute)">'+esc(i.hint)+'</small>':'')+'<div class="seg"><button class="s'+(x==="separado"?' on':'')+'" data-tog="'+i.id+'|separado">Separado</button><button class="m'+(x==="conferido"?' on':'')+'" data-tog="'+i.id+'|conferido">Conferido comigo</button></div></li>'});
  h+='</ul></section>';
  h+='<div class="zones">'+zone("z-f","Falta pegar",fa,"Nada faltando aqui.")+zone("z-s","Separado, fora da mala",se,"Nada esperando para entrar na mala.")+zone("z-m","Na mala",ma,"Ainda nada na mala.")+'</div>';
  var pend=ptasks().filter(function(t){return !pdone(t.id)}).length;
  h+='<button class="btn n" data-go="plan" style="width:100%">Ver o Plano da Viagem ('+pend+' tarefas pendentes)</button>';
  if(na.length){h+='<details class="nao"><summary>Não vou levar ('+na.length+')</summary><ul style="list-style:none;padding:0;display:flex;flex-direction:column;gap:6px">';na.forEach(function(i){h+='<li class="row"><div class="nm"><span>'+esc(i.name)+'</span><span><button class="link" data-buy="'+i.id+'">comprar lá</button><button class="link" data-set="'+i.id+'|falta">Voltar para falta</button></span></div></li>'});h+='</ul></details>'}
  h+='</div>';

}

  }
  var falta=items.filter(function(i){var x=st(i.id);return x==="novo"||x==="falta"});
  var sep=items.filter(function(i){return st(i.id)==="separado"});
  var con=items.filter(function(i){return st(i.id)==="conferido"});
  var nao=items.filter(function(i){return st(i.id)==="naovai"});
  var ess=falta.filter(function(i){return i.cat==="docs"}).length+sep.filter(function(i){return i.cat==="docs"}).length;
  var ready=S.docs._meta&&S.docs._meta.ready;
  var h='<div class="sum"><div class="ready"><p>'+(ready?'<b>Você decidiu: pronta para partir.</b> Se lembrar de algo, é só reabrir.':'<b>Você decide quando está pronta.</b> '+(falta.length?falta.length+' ainda sem separar':'Nada sem separar')+(ess?', e '+ess+' essenciais em Documentos ainda sem conferência.':'.'))+'</p><button class="btn p" data-ready="'+(ready?0:1)+'">'+(ready?'Reabrir':'Estou pronta para partir')+'</button></div>';

document.addEventListener("click",function(e){
  var b;
  if((b=e.target.closest("[data-c]"))){S.cat=b.dataset.c;render();return}
  if((b=e.target.closest("[data-cat]"))){S.cat=b.dataset.cat;render();return}
  if((b=e.target.closest("[data-go]"))){S.mode=b.dataset.go;render();return}
  if((b=e.target.closest("[data-a]"))){if(!b.disabled)flyBtn(b.dataset.a);return}
  if((b=e.target.closest("[data-q]"))){
    var it=deck()[0];if(!it)return;var q=qtyOf(it)+Number(b.dataset.q);if(q<0)q=0;setItem(it.id,{qty:q},true);return}
  if((b=e.target.closest("[data-undo]"))){undo();return}
  if((b=e.target.closest("[data-set]"))){var p=b.dataset.set.split("|");setItem(p[0],{state:p[1]});return}
  if((b=e.target.closest("[data-tog]"))){var q2=b.dataset.tog.split("|");setItem(q2[0],{state:st(q2[0])===q2[1]?"falta":q2[1]});return}
  if((b=e.target.closest("[data-vq]"))){var q3=b.dataset.vq.split("|");var cur=allItems().filter(function(i){return i.id===q3[0]})[0];var nq=Math.max(0,qtyOf(cur)+Number(q3[1]));setItem(q3[0],{qty:nq},true);return}
  if((b=e.target.closest("[data-ptask]"))){var pid=b.dataset.ptask;psave(pid,Object.assign({},S.plano[pid]||{},{done:!pdone(pid),updatedAt:Date.now(),by:"odara"}));return}
  if((b=e.target.closest("[data-pdel]"))){pdrop(b.dataset.pdel);toast("Tarefa removida");return}
  if((b=e.target.closest("[data-buy]"))){
    var bid=b.dataset.buy,bit=allItems().filter(function(i){return i.id===bid})[0];if(!bit)return;
    setItem(bid,{state:"naovai"});
    var tid2="pl-buy-"+bid;

    toast("Tarefa de compra criada em Na chegada");return}
  if((b=e.target.closest("[data-task]"))){var tid=b.dataset.task;setItem(tid,{done:!(S.docs[tid]&&S.docs[tid].done)},true);return}
  if((b=e.target.closest("[data-ready]"))){setItem("_meta",{ready:b.dataset.ready==="1"},true);return}
  if((b=e.target.closest("[data-cy]"))){
    var id=b.dataset.cy,cur=st(id),nx={novo:"separado",falta:"separado",separado:"conferido",conferido:"falta",naovai:"falta"}[cur];
    setItem(id,{state:nx});return}
  if(e.target.id==="m-sep"){S.mode="sep";render();return}
  if(e.target.id==="m-con"){S.mode="con";render();return}
  if(e.target.id==="m-vis"){S.mode="vis";render();return}
  if(e.target.id==="m-plan"){S.mode="plan";render();return}
  if(e.target.id==="m-doc"){S.mode="doc";render();return}
});

  var db=null;
  try{db=await claude.use("db")}catch(e){db=null}
  if(!db){setSync("off");return}
  S.db=db;S.col=db.collection("mala");S.pcol=db.collection("plano");
  S.pcol.onSnapshot(function(snap){
    var next={};snap.docs.forEach(function(d){next[d.id]=d.data()});

  },function(){setSync("err")});
  S.col.onSnapshot(function(snap){
    var next={};snap.docs.forEach(function(d){next[d.id]=d.data()});
    S.docs=next;setSync("ok");render();
  },function(){setSync("err")});
})();
})();
